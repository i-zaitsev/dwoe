{{define "log-row"}}
<div class="log {{eventClass .Kind}}">
	<span class="time">{{.Time}}</span>
	<span class="kind">{{.Kind}}</span>
	{{if or .Detail .Raw}}
	<details{{if eq .Kind "result"}} open{{end}}><summary>{{.Text}}</summary>{{if .Detail}}<pre>{{.Detail}}</pre>{{end}}{{if .Raw}}<pre class="json">{{range prettyJSON .Raw}}{{if .Class}}<span class="{{.Class}}">{{.Text}}</span>{{else}}{{.Text}}{{end}}{{end}}</pre>{{end}}</details>
	{{else}}
	<span class="text">{{.Text}}</span>
	{{end}}
</div>
{{end}}
{{define "log-error-row"}}
<div class="log err">
	<span class="kind">error</span>
	<span class="text">{{.}}</span>
</div>
{{end}}
