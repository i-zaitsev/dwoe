{{define "content"}}
{{template "workspace-info" .Workspace}}
{{with .Workspace}}
	{{if .Prompt}}
	<details class="panel fold">
		<summary><h2>Prompt</h2></summary>
		<pre class="code"><code>{{.Prompt}}</code></pre>
	</details>
	{{end}}
	{{if .TaskConfig}}
	<details class="panel fold">
		<summary><h2>Task config</h2></summary>
		<pre class="code"><code>{{.TaskConfig}}</code></pre>
	</details>
	{{end}}
	<details class="panel fold" open>
		<summary><h2>Logs</h2></summary>
		{{template "log-stream" .}}
		<div id="log-end"></div>
	</details>
	<details class="panel fold" open>
		<summary><h2>Changes</h2></summary>
		{{template "diff-lazy" .}}
	</details>
{{end}}
{{end}}
